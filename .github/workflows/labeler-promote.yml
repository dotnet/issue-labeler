# Promote a model from staging to 'ACTIVE', backing up the currently 'ACTIVE' model
name: "Labeler: Promotion"

on:
  # Dispatched via the Actions UI, promotes the staged models from
  # a staged slot into the prediction environment
  workflow_dispatch:
    inputs:
      issues:
        description: "Issues: Promote Model"
        type: boolean
        required: true
      pulls:
        description: "Pulls: Promote Model"
        type: boolean
        required: true
      discussions:
        description: "Discussions: Promote Model"
        type: boolean
        required: true
      staged_key:
        description: "Cache key suffix of the model to promote to 'ACTIVE'. Defaults to staged_YYYY-MM-DD (today in UTC)."
      backup_key:
        description: "Cache key suffix for backing up the active model. Defaults to backup_YYYY-MM-DD (today in UTC)."

permissions: {}

jobs:
  resolve-cache-keys:
    runs-on: ubuntu-latest
    outputs:
      staged_key: ${{ inputs.staged_key || format('staged_{0}', steps.date.outputs.today) }}
      backup_key: ${{ inputs.backup_key || format('backup_{0}', steps.date.outputs.today) }}
    steps:
      - id: date
        run: date -u '+today=%F' >> "$GITHUB_OUTPUT"

  promote-issues:
    needs: resolve-cache-keys
    if: ${{ github.event.inputs.issues == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: "Promote Model for Issues"
        uses: dotnet/issue-labeler/promote@160b6b1e1e8d36da09beb34ef1e4806d2c0520a3 # v2.2.0
        with:
          type: "issues"
          staged_key: ${{ needs.resolve-cache-keys.outputs.staged_key }}
          backup_key: ${{ needs.resolve-cache-keys.outputs.backup_key }}

  promote-pulls:
    needs: resolve-cache-keys
    if: ${{ github.event.inputs.pulls == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: "Promote Model for Pull Requests"
        uses: dotnet/issue-labeler/promote@160b6b1e1e8d36da09beb34ef1e4806d2c0520a3 # v2.2.0
        with:
          type: "pulls"
          staged_key: ${{ needs.resolve-cache-keys.outputs.staged_key }}
          backup_key: ${{ needs.resolve-cache-keys.outputs.backup_key }}

  promote-discussions:
    needs: resolve-cache-keys
    if: ${{ github.event.inputs.discussions == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: "Promote Model for Discussions"
        uses: dotnet/issue-labeler/promote@160b6b1e1e8d36da09beb34ef1e4806d2c0520a3 # v2.2.0
        with:
          type: "discussions"
          staged_key: ${{ needs.resolve-cache-keys.outputs.staged_key }}
          backup_key: ${{ needs.resolve-cache-keys.outputs.backup_key }}
