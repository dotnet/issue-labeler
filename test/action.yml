name: "Test Model"
description: "Evaluate a model against the exact held-out dataset saved during its training."

branding:
  color: "purple"
  icon: "tag"

inputs:
  type:
    description: "The model to test. Must be 'issues', 'pulls', or 'discussions'."
    required: true
  label_prefix:
    description: "Deprecated. The label selection is frozen in the saved test set."
    deprecationMessage: "label_prefix is ignored; the tester evaluates the saved held-out dataset."
  threshold:
    description: "The minimum confidence score for a label prediction. Must be a number between 0.00 and 1.00. The recommended value is 0.40."
    required: true
  excluded_authors:
    description: "Deprecated. Author selection is frozen in the saved test set."
    deprecationMessage: "excluded_authors is ignored; configure it when downloading training data."
  excluded_labels:
    description: "A comma-separated list of labels to report if detected. Does not filter the saved test set."
  limit:
    description: "Deprecated. All saved held-out rows are evaluated."
    deprecationMessage: "limit is ignored; the tester evaluates the entire saved held-out dataset."
  page_size:
    description: "Deprecated. Testing no longer makes GitHub API requests."
    deprecationMessage: "page_size is ignored; testing no longer downloads GitHub items."
  page_limit:
    description: "Deprecated. Testing no longer makes GitHub API requests."
    deprecationMessage: "page_limit is ignored; testing no longer downloads GitHub items."
  retries:
    description: "Deprecated. Testing no longer makes GitHub API requests."
    deprecationMessage: "retries is ignored; testing no longer downloads GitHub items."
  cache_key:
    description: "The model cache key suffix to restore. Its held-out data is located using the model's content hash."
    default: staged
  repository:
    description: "Deprecated. Repository selection is frozen in the saved test set."
    deprecationMessage: "repository is ignored; the tester evaluates the data saved during training."
  verbose:
    description: "Enable verbose output."

runs:
  using: "composite"
  steps:
    - name: "Validate Inputs"
      shell: bash
      run: |
        if [[ "${{ inputs.type }}" != "issues" && "${{ inputs.type }}" != "pulls" && "${{ inputs.type }}" != "discussions" ]]; then
          echo "::error::'type' must be 'issues', 'pulls', or 'discussions'. Value provided: '${{ inputs.type }}'."
          echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
          echo "\`type\` must be 'issues', 'pulls', or 'discussions'." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "MODEL_PATH=labeler-cache/${{ inputs.type }}-model.zip" >> "$GITHUB_ENV"
        echo "TEST_DATA_PATH=labeler-cache/${{ inputs.type }}-model.test-data.bin" >> "$GITHUB_ENV"

    - name: "Restore model from cache"
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.MODEL_PATH }}
        key: "issue-labeler/model/${{ inputs.type }}/${{ inputs.cache_key || 'staged' }}"
        fail-on-cache-miss: true

    - name: "Check Restored Model"
      shell: bash
      run: |
        if [[ ! -s "$MODEL_PATH" ]]; then
          echo "::error::The restored model file is missing or empty."
          exit 1
        fi

    - name: "Restore Held-Out Data from Cache"
      id: restore-test-data
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.TEST_DATA_PATH }}
        key: issue-labeler/test-data/${{ inputs.type }}/${{ hashFiles(env.MODEL_PATH) }}

    - name: "Require the Original Held-Out Data"
      if: ${{ steps.restore-test-data.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        echo "::error::The held-out dataset for this model is unavailable. Retrain the model; live GitHub data cannot replace the original split."
        exit 1

    - name: "Set up the .NET SDK"
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: "10.0.x"

    - name: "Run Tester"
      shell: bash
      run: |
        dotnet run -c Release --project "${{ github.action_path }}/../IssueLabeler/src/Tester" --  \
          ${{ format('--threshold {0}', inputs.threshold) }} \
          ${{ inputs.type == 'pulls' && '--pulls-model' || '--issues-model' }} "${{ env.MODEL_PATH }}" \
          ${{ inputs.type == 'discussions' && '--discussions' || '' }} \
          ${{ (inputs.excluded_labels && format('--excluded-labels "{0}"', inputs.excluded_labels)) || '' }} \
          ${{ inputs.verbose && '--verbose' || '' }}
