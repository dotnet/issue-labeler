name: "Test Model"
description: "Evaluate saved held-out scores offline, or historically recheck a model by downloading currently labeled items."

branding:
  color: "purple"
  icon: "tag"

inputs:
  mode:
    description: "Use 'historical' to recheck current labels (may include training examples), or 'heldout' to evaluate saved scores without downloads."
    default: "historical"
  type:
    description: "The model to test. Must be 'issues', 'pulls', or 'discussions'. Discussions use the issues model path."
    required: true
  label_prefix:
    description: "The label prefix to use for model training. Must end with a non-alphanumeric character."
    required: true
  threshold:
    description: "The minimum confidence score for a label prediction. Must be a number between 0.00 and 1.00. The recommended value is 0.40."
    required: true
  target_precisions:
    description: "Target precisions (0-1) for heldout mode. Selects maximum-coverage cutoffs on the saved data; no production settings are changed."
    default: "0.80,0.90,0.95"
  excluded_authors:
    description: "A comma-separated list of authors to exclude."
  excluded_labels:
    description: "A comma-separated list of labels that should be excluded from training/test data."
  limit:
    description: "The maximum number of items to download. The newest items are downloaded."
  page_size:
    description: "The number of items per page in GitHub API requests. Defaults to 100 for Issues and 25 for Pull Requests."
  page_limit:
    description: "The maximum number of pages to retrieve. Defaults to 1000 for Issues and 4000 for Pull Requests."
  retries:
    description: "A comma-separated list of retry delays in seconds. Defaults to '30,30,300,300,3000,3000'."
  cache_key:
    description: "The cache key suffix to use for saving data. Defaults to 'staged'."
    default: staged
  repository:
    description: "The org/repo to download data from. Defaults to the current repository."
  verbose:
    description: "Enable verbose output."

runs:
  using: "composite"
  steps:
    - name: "Validate Inputs"
      shell: bash
      run: |
        if [[ "${{ inputs.type }}" != "issues" && "${{ inputs.type }}" != "pulls" && "${{ inputs.type }}" != "discussions" ]]; then
          echo "::error::'type' must be 'issues', 'pulls', or 'discussions'. Value provided: '${{ inputs.type }}'."
          echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
          echo "\`type\` must be 'issues', 'pulls', or 'discussions'." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        if [[ "$EVALUATION_MODE" != "historical" && "$EVALUATION_MODE" != "heldout" ]]; then
          echo "::error::'mode' must be 'historical' or 'heldout'."
          exit 1
        fi
        if [[ "$EVALUATION_MODE" == "heldout" && ( -n "$HISTORICAL_OPTIONS" || ( -n "$VERBOSE" && "$VERBOSE" != "false" ) ) ]]; then
          echo "::error::Historical download/filter options cannot be combined with heldout mode."
          exit 1
        fi
        echo "EVALUATION_PATH=labeler-cache/${{ inputs.type }}-model.evaluation.json" >> "$GITHUB_ENV"
        echo "REPORT_PATH=labeler-cache/${{ inputs.type }}-evaluation-report" >> "$GITHUB_ENV"
      env:
        EVALUATION_MODE: ${{ inputs.mode }}
        HISTORICAL_OPTIONS: ${{ format('{0}{1}{2}{3}{4}{5}{6}', inputs.repository, inputs.excluded_authors, inputs.excluded_labels, inputs.limit, inputs.page_size, inputs.page_limit, inputs.retries) }}
        VERBOSE: ${{ inputs.verbose }}

    - name: "Restore model from cache"
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: "labeler-cache/${{ inputs.type == 'pulls' && 'pulls' || inputs.type == 'discussions' && 'discussions' || 'issues' }}-model.zip"
        key: "issue-labeler/model/${{ inputs.type }}/${{ inputs.cache_key || 'staged' }}"
        fail-on-cache-miss: true

    - name: "Restore Held-out Scores from Cache"
      if: ${{ inputs.mode == 'heldout' }}
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.EVALUATION_PATH }}
        key: issue-labeler/evaluation/${{ inputs.type }}/${{ inputs.cache_key || 'staged' }}
        fail-on-cache-miss: true

    - name: "Set up the .NET SDK"
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: "10.0.x"

    - name: "Run Tester"
      if: ${{ inputs.mode == 'historical' }}
      shell: bash
      run: |
        dotnet run -c Release --project "${{ github.action_path }}/../IssueLabeler/src/Tester" --  \
          ${{ format('--repo "{0}"', inputs.repository || github.repository) }} \
          ${{ format('--label-prefix "{0}"', inputs.label_prefix) }} \
          ${{ format('--threshold {0}', inputs.threshold) }} \
          ${{ inputs.type == 'pulls' && '--pulls-model "labeler-cache/pulls-model.zip"' || inputs.type == 'discussions' && '--issues-model "labeler-cache/discussions-model.zip"' || '--issues-model "labeler-cache/issues-model.zip"' }} \
          ${{ inputs.type == 'discussions' && '--discussions' || '' }} \
          ${{ (inputs.excluded_authors && format('--excluded-authors "{0}"', inputs.excluded_authors)) || '' }} \
          ${{ (inputs.excluded_labels && format('--excluded-labels "{0}"', inputs.excluded_labels)) || '' }} \
          ${{ (inputs.limit && format('--{0}-limit {1}', inputs.type, inputs.limit)) || '' }} \
          ${{ (inputs.page_size && format('--page-size {0}', inputs.page_size)) || '' }} \
          ${{ (inputs.page_limit && format('--page-limit {0}', inputs.page_limit)) || '' }} \
          ${{ (inputs.retries && format('--retries {0}', inputs.retries)) || '' }} \
          ${{ inputs.verbose && '--verbose' || '' }}

    - name: "Evaluate Saved Held-out Scores"
      if: ${{ inputs.mode == 'heldout' }}
      shell: bash
      env:
        MODEL_TYPE: ${{ inputs.type }}
        LABEL_PREFIX: ${{ inputs.label_prefix }}
        REFERENCE_THRESHOLD: ${{ inputs.threshold }}
        TARGET_PRECISIONS: ${{ inputs.target_precisions }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [[ "$MODEL_TYPE" == "pulls" ]]; then
          model_args=(--pulls-model "labeler-cache/pulls-model.zip")
        else
          model_args=(--issues-model "labeler-cache/${MODEL_TYPE}-model.zip")
        fi
        dotnet run -c Release --project "$ACTION_PATH/../IssueLabeler/src/Tester" -- \
          "${model_args[@]}" \
          --evaluation "$EVALUATION_PATH" \
          --label-prefix "$LABEL_PREFIX" \
          --threshold "$REFERENCE_THRESHOLD" \
          --target-precisions "$TARGET_PRECISIONS" \
          --report "$REPORT_PATH"
